services:
  postgres:
    image: postgres:17-alpine
    container_name: quant-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant_local_dev_only
      POSTGRES_DB: quant_engine
    ports:
      - "5432:5432"
    volumes:
      - quant_engine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quant_engine_pgdata:
