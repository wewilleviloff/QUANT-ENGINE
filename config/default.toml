[app]
name = "quant-engine"
mode = "paper"
bind_addr = "127.0.0.1:8080"
live_trading_enabled = false

[exchange]
name = "bybit"
category = "linear"
environment = "testnet"
account_position_mode = "one_way"

[universe]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
max_symbols = 20

[risk]
max_open_positions = 3
max_margin_fraction_per_position = "0.10"
max_leverage = "3"
risk_fraction_per_trade = "0.005"
max_aggregate_open_risk_fraction = "0.015"
daily_loss_limit_fraction = "0.02"

[execution]
enabled = false
require_exchange_stop_confirmation = true
client_order_id_prefix = "qe"

[strategy.trend_pullback]
enabled = false
entry_timeframe = "5m"
confirmation_timeframe = "15m"
regime_timeframe = "1h"
