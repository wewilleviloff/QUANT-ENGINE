[workspace]
resolver = "3"
members = [
  "apps/trading-engine",
  "crates/quant-accounting",
  "crates/quant-api",
  "crates/quant-domain",
  "crates/quant-exchange-bybit",
  "crates/quant-execution",
  "crates/quant-market-data",
  "crates/quant-persistence",
  "crates/quant-risk",
  "crates/quant-strategy",
  "crates/quant-telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
